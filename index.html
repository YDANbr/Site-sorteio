<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio Fácil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎁 Sorteio Fácil</h1>
        <p>Faça seu sorteio de maneira simples e rápida!</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Participantes do sorteio</h2>
            <p>Digite os nomes abaixo, colocando um nome por linha.</p>

            <textarea id="nomes"
                placeholder="Exemplo:
Maria
João
Ana
Pedro"></textarea>

            <button onclick="sortear()">Sortear ganhador</button>

            <div id="resultado">
                <h3>O ganhador aparecerá aqui!</h3>
            </div>
        </section>
    </main>


       
<footer>
    <p>© 2026 Sorteio Fácil - Desenvolvido por Thiago Pereira.</p>
</footer>

    </footer>

    <script src="script.js"></script>
</body>
</html>
